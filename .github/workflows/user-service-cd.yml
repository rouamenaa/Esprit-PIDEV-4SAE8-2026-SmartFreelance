pipeline {
    agent any

    environment {
        IMAGE_NAME = "chbaycha/user-service"
        IMAGE_TAG = "${BUILD_NUMBER}"

        JAVA_HOME = "/usr/lib/jvm/java-17-openjdk-amd64"
        PATH = "${JAVA_HOME}/bin:${env.PATH}"

        K8S_NAMESPACE = "smartfreelance"
    }

    stages {

        stage('Checkout') {
            steps {
                checkout scm
            }
        }

        stage('Build & Test') {
            steps {
                dir('smartfreelance-backend/user-service') {
                    sh '''
                        set -e

                        echo "JAVA_HOME=$JAVA_HOME"

                        java -version
                        mvn -version

                        mvn clean verify -B
                    '''
                }
            }
        }

        stage('Build Docker Image') {
            steps {
                dir('smartfreelance-backend/user-service') {

                    sh '''
                        docker build \
                          -t ${IMAGE_NAME}:${IMAGE_TAG} \
                          -t ${IMAGE_NAME}:latest .
                    '''
                }
            }
        }

        stage('Push Docker Image') {
            steps {

                withCredentials([
                    usernamePassword(
                        credentialsId: 'dockerhub-creds',
                        usernameVariable: 'DOCKER_USER',
                        passwordVariable: 'DOCKER_PASS'
                    )
                ]) {

                    sh '''
                        set -e

                        echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

                        docker push ${IMAGE_NAME}:${IMAGE_TAG}
                        docker push ${IMAGE_NAME}:latest

                        docker logout
                    '''
                }
            }
        }

        stage('Deploy to Kubernetes') {
            steps {

                withCredentials([
                    file(
                        credentialsId: 'kubeconfig-user-service',
                        variable: 'KUBECONFIG_FILE'
                    )
                ]) {

                    dir('smartfreelance-backend/user-service') {

                        sh '''
                            set -e

                            export KUBECONFIG=$KUBECONFIG_FILE

                            kubectl cluster-info

                            kubectl apply -f devops/k8s/namespace.yml

                            kubectl apply -f devops/k8s/user-service-configmap.yml || true
                            kubectl apply -f devops/k8s/user-service-secret.yml || true

                            kubectl apply -f devops/k8s/user-service-deployment.yml
                            kubectl apply -f devops/k8s/user-service-service.yml

                            kubectl rollout restart deployment/user-service -n ${K8S_NAMESPACE}

                            kubectl rollout status deployment/user-service -n ${K8S_NAMESPACE}
                        '''
                    }
                }
            }
        }
    }

    post {

        always {

            sh '''
                docker image prune -f || true
            '''
        }

        success {
            echo 'Pipeline completed successfully!'
        }

        failure {
            echo 'Pipeline failed!'
        }
    }
}