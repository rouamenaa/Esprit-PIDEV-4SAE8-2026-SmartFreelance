apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-contract-service
  labels:
    app: application-contract-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: application-contract-service
  template:
    metadata:
      labels:
        app: application-contract-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8083"
        sidecar.istio.io/inject: "true"
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: application-contract-service
          image: localhost:8081/smartfreelance/application-contract-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
              name: http
          envFrom:
            - configMapRef:
                name: application-contract-service-config
            - secretRef:
                name: application-contract-service-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi