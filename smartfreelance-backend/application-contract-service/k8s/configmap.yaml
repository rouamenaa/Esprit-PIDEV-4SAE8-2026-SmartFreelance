apiVersion: v1
kind: ConfigMap
metadata:
  name: application-contract-service-config
  labels:
    app: application-contract-service
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  SERVER_PORT: "8083"
  SPRING_APPLICATION_NAME: "microservice-condidature"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/condidature_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.MySQL8Dialect"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"
  EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
  EUREKA_CLIENT_FETCH_REGISTRY: "true"
  PROJECT_SERVICE_BASE_URL: "http://project-service:8082"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://jaeger-collector.monitoring.svc.cluster.local:9411/api/v2/spans"