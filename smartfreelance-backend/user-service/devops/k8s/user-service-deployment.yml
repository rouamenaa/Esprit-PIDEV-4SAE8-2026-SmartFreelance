apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: smartfreelance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: chbaycha/user-service:latest   # ← must match IMAGE_NAME in Jenkinsfile
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-service:8761/eureka   # ← point to K8s eureka, not localhost